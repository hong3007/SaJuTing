<style>
:root {
  --bg: #faf7fc; --card: #fff; --text: #21162a; --muted: #6f6478; --line: #e7deee; --accent: #e0457b; --accent-text: #fff; --soft: #fde8f0;
  --wood: #2f8f55; --fire: #d9434b; --earth: #b98a22; --metal: #7c808c; --water: #2c5aa0; --plus: #1f8a4c; --minus: #c23b47;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17101d; --card: #221829; --text: #f1eaf5; --muted: #a99bb3; --line: #3a2d44; --accent: #ff5d8f; --accent-text: #1b0f20; --soft: #3b1f33;
  --plus: #5fd08f; --minus: #ff7a84;
} }
:root[data-theme="dark"] {
  --bg: #17101d; --card: #221829; --text: #f1eaf5; --muted: #a99bb3; --line: #3a2d44; --accent: #ff5d8f; --accent-text: #1b0f20; --soft: #3b1f33;
  --plus: #5fd08f; --minus: #ff7a84;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 80px; }
header { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; }
header img { width: 36px; height: 36px; }
header h1 { font-size: 20px; margin: 0; }
header small, .muted, .hint { color: var(--muted); }
.hint { font-size: 13px; margin: 8px 0 0; }
h2 { font-size: 16px; margin: 22px 0 8px; }
label { display: block; font-size: 13px; color: var(--muted); margin-top: 12px; }
label.check { display: flex; gap: 8px; align-items: flex-start; color: var(--text); font-size: 14px; }
label.check input { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.row { display: flex; gap: 6px; }
.row > * { flex: 1; min-width: 0; }
input, select, button { font: inherit; color: var(--text); }
input, select { width: 100%; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
button { display: block; width: 100%; margin: 14px 0 0; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 15px; cursor: pointer; }
button:disabled { opacity: .5; }
button.ghost { background: var(--soft); color: var(--text); }
button.link { background: none; color: var(--muted); font-weight: 400; font-size: 13px; text-decoration: underline; width: auto; margin: 28px auto 0; }
.card { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 14px; margin-bottom: 10px; }
.error { color: var(--minus); font-weight: 600; }
summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
.item summary { display: flex; align-items: center; gap: 10px; }
.rank { width: 1.6em; color: var(--muted); font-weight: 700; text-align: center; }
.who { flex: 1; min-width: 0; }
.who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who small { color: var(--muted); }
.score { font-size: 26px; font-weight: 800; color: var(--accent); }
.badge { display: inline-block; font-size: 11px; border-radius: 99px; padding: 1px 8px; margin-left: 4px; background: var(--line); color: var(--text); }
.badge.on { background: var(--accent); color: var(--accent-text); }
.sub { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
.kakao { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
.kakao b { font-size: 18px; word-break: break-all; }
.pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin-top: 12px; }
.pillars .lbl { font-size: 12px; color: var(--muted); }
.ch { border-radius: 10px; color: #fff; font-size: 18px; font-weight: 700; padding: 4px 0; margin-top: 4px; }
.ch small { display: block; font-size: 11px; font-weight: 400; opacity: .9; }
.e0 { background: var(--wood); } .e1 { background: var(--fire); } .e2 { background: var(--earth); } .e3 { background: var(--metal); } .e4 { background: var(--water); }
.empty { border: 1px dashed var(--line); color: var(--muted); font-size: 12px; font-weight: 400; padding: 14px 0; }
.els { display: flex; gap: 4px; margin-top: 8px; }
.els span { flex: 1; text-align: center; font-size: 12px; color: #fff; border-radius: 6px; padding: 2px 0; }
.els span.zero { opacity: .3; }
ul { list-style: none; padding: 0; margin: 8px 0 0; }
li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
li .pts { width: 2.6em; flex: none; text-align: right; font-weight: 700; }
.plus { color: var(--plus); } .minus { color: var(--minus); }
h3 { font-size: 14px; margin: 16px 0 4px; }
.stars { color: var(--accent); letter-spacing: 1px; }
.nickbox { text-align: center; padding: 4px 0; }
.nickbox .emoji { display: block; font-size: 40px; line-height: 1.2; }
.nickbox .nick { display: block; font-size: 21px; font-weight: 800; margin-bottom: 2px; }
.read { margin: 0; font-size: 14px; }
ul.plain li { display: list-item; list-style: "· "; margin-left: 1em; padding: 3px 0; border: 0; }
#msg { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; }
#msg:empty { display: none; }
#msg.bad { background: var(--minus); color: #fff; }
</style>
</head>
<body>
<main>
  <header>
    <img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3CclipPath id='c'%3E%3Ccircle cx='25' cy='32' r='13'/%3E%3C/clipPath%3E%3Crect width='64' height='64' rx='14' fill='%232b1638'/%3E%3Ccircle cx='25' cy='32' r='13' fill='%23f5b942'/%3E%3Ccircle cx='39' cy='32' r='13' fill='%23ff5d8f'/%3E%3Ccircle cx='39' cy='32' r='13' fill='%23fff' clip-path='url(%23c)'/%3E%3C/svg%3E">
    <div><h1>SaJuTeeing</h1><small>사주 + MBTI 궁합 소개팅 · 베타</small></div>
  </header>

  <form id="join" class="card" hidden>
    <b>내 프로필 만들기</b>
    <label>닉네임</label>
    <input name="nickname" required maxlength="20" autocomplete="nickname">
    <div class="row">
      <div><label>나</label><select name="gender"><option value="M">남자</option><option value="F">여자</option></select></div>
      <div><label>만나고 싶은 상대</label><select name="want"><option value="F">여자</option><option value="M">남자</option></select></div>
    </div>
    <label>생년월일</label>
    <div class="row">
      <select name="calendar" aria-label="달력" style="flex:1.3"><option value="solar">양력</option><option value="lunar">음력</option><option value="leap">음력 윤달</option></select>
      <select name="year" required aria-label="연" style="flex:1.2"><option value="">연</option></select>
      <select name="month" required aria-label="월"><option value="">월</option></select>
      <select name="day" required aria-label="일"><option value="">일</option></select>
    </div>
    <label>태어난 시각</label>
    <div class="row">
      <select name="hour" aria-label="시"><option value="">모름</option></select>
      <select name="minute" aria-label="분"></select>
    </div>
    <div class="row">
      <div><label>출생지</label><select name="place"></select></div>
      <div><label>MBTI</label><select name="mbti"><option value="">모름</option></select></div>
    </div>
    <label>카카오톡 ID</label>
    <input name="kakao_id" required maxlength="40" autocapitalize="off" autocomplete="off" spellcheck="false">
    <p class="hint">서로 [연락하기]를 누른 사람에게만 공개돼요. 카카오톡 설정에서 'ID 검색 허용'을 켜 두세요.</p>
    <label class="check"><input type="checkbox" required> 만 19세 이상입니다.</label>
    <label class="check"><input type="checkbox" required> 닉네임·성별·출생연도·사주 결과·MBTI·카카오톡 ID를 추천과 매칭에만 쓰는 데 동의합니다. 생년월일과 시각은 저장하지 않고, 삭제하면 바로 지워집니다.</label>
    <p class="hint">베타 기간에는 로그인 없이 이 기기(브라우저)에서만 내 프로필이 열려요. 브라우저 기록을 지우면 다시 가입해야 해요.</p>
    <button>가입하고 추천 보기</button>
  </form>

  <section id="home" hidden>
    <details class="card" id="mine"></details>
    <div id="list"></div>
    <button type="button" class="link" id="del">내 정보 삭제</button>
  </section>
  <div id="msg" role="status" aria-live="polite"></div>
</main>

<script>
const SB = 'https://hirsbmfvouchasqwopsv.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_-NluhOD-upGiG9TpiRPyUQ_zGxT2-rn';          // 공개용 키 (화면에 넣어도 되는 키)
const STORE = 'sajuteeing.me', TOP = 20;
const MBTI = ['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];
const $ = s => document.querySelector(s);
const join = $('#join'), home = $('#home'), list = $('#list');
let me = load(), cands = [], msgTimer;

async function rpc(fn, body) {
  const r = await fetch(SB + fn, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => null);
  if (r.ok) return j;
  if (/다시 가입/.test(j?.message)) { me = null; save(null); show(); }  // 서버에 내 프로필이 없음 → 가입 화면으로
  throw new Error(j?.message || `서버 오류 (${r.status})`);
}
function load() { try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; } }
function save(v) { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch {} }
function msg(text, bad) {
  const m = $('#msg'); m.textContent = text; m.className = bad ? 'bad' : '';
  clearTimeout(msgTimer); msgTimer = setTimeout(() => m.textContent = '', 4000);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const pillarsHtml = r => {
  const by = Object.fromEntries(r.pillars.map(p => [p.label, p]));
  return '<div class="pillars">' + ['시', '일', '월', '년'].map(l => {
    const p = by[l];
    if (!p) return `<div><div class="lbl">${l}주</div><div class="ch empty">시각 모름</div></div>`;
    return `<div><div class="lbl">${l}주</div>
      <div class="ch e${p.g >> 1}">${p.ko[0]}<small>${p.hanja[0]} · ${Saju.EL[p.g >> 1]}</small></div>
      <div class="ch e${Saju.ZHI_EL[p.z]}">${p.ko[1]}<small>${p.hanja[1]}</small></div></div>`;
  }).join('') + '</div><div class="els">' +
    r.count.map((n, e) => `<span class="e${e}${n ? '' : ' zero'}">${Saju.EL[e]} ${n}</span>`).join('') + '</div>';
};
const reasonsHtml = rs => '<ul>' + rs.map(r =>
  `<li><span class="pts ${r.pts >= 0 ? 'plus' : 'minus'}">${r.pts > 0 ? '+' : ''}${r.pts}</span><span>${esc(r.text)}</span></li>`).join('') + '</ul>';

function item(c) {
  const m = c.m;
  const badge = c.kakao_id ? '' : c.likes_me ? '<span class="badge on">나에게 연락하기를 눌렀어요</span>'
    : c.liked_by_me ? '<span class="badge">연락하기 보냄</span>' : '';
  const action = c.kakao_id
    ? `<div class="kakao">카카오톡 ID<br><b>${esc(c.kakao_id)}</b></div>
       <div class="row"><button class="ghost" data-act="copy" data-i="${c.i}">ID 복사</button><button data-act="share" data-i="${c.i}">궁합 공유하기</button></div>
       <p class="hint">카카오톡 → 친구 추가 → ID로 추가에 붙여 넣고, [궁합 공유하기]로 결과를 보내며 대화를 시작해 보세요.</p>`
    : c.liked_by_me ? '<p class="hint">상대도 [연락하기]를 누르면 카카오톡 ID가 열려요.</p>'
    : `<button data-act="like" data-i="${c.i}">연락하기</button>`;
  return `<details class="card item"${c.kakao_id ? ' open' : ''}>
    <summary><span class="rank">${c.i + 1}</span>
      <span class="who"><b>${esc(c.nickname)}</b><small>${esc(c.birth_year)}년생 · ${esc(c.mbti || 'MBTI 모름')}</small>${badge}</span>
      <span class="score">${m.total}</span></summary>
    <h3>상대는 ${esc(Saju.reading(c.saju).type)} 같은 사람</h3>
    <p class="read">${esc(Saju.reading(c.saju).me)}</p>
    <h3>궁합 <small class="muted">사주 ${m.saju.score}점${m.mbti ? ` · MBTI ${m.mbti.score}점` : ''}</small></h3>
    ${reasonsHtml([...m.saju.reasons, ...(m.mbti ? m.mbti.reasons : [])])}
    ${pillarsHtml(c.saju)}
    ${action}</details>`;
}

async function refresh() {
  list.innerHTML = '<p class="muted">불러오는 중…</p>';
  let rows;
  try { rows = await rpc('candidates', { my_id: me.id, my_token: me.token }); }
  catch (e) { list.innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  const mine = { saju: Saju.unpack(me.saju), mbti: me.mbti };
  cands = rows.flatMap(r => {                                         // 다른 사람이 보낸 사주 값은 unpack에서 검사
    try { const saju = Saju.unpack(r.saju); return [{ ...r, saju, m: Saju.match(mine, { saju, mbti: r.mbti }) }]; } catch { return []; }
  }).sort((a, b) => b.m.total - a.m.total);
  cands.forEach((c, i) => c.i = i);
  const matched = cands.filter(c => c.kakao_id);
  const top = cands.filter(c => !c.kakao_id && c.i < TOP);
  const more = cands.filter(c => !c.kakao_id && c.i >= TOP && (c.likes_me || c.liked_by_me));
  list.innerHTML = (matched.length ? `<h2>매칭 성공 ${matched.length}</h2>` + matched.map(item).join('') : '') +
    `<h2>궁합 TOP ${TOP}</h2>` +
    (top.length ? top.map(item).join('') : '<p class="muted">아직 추천할 사람이 없어요. 링크를 친구에게 알려 주세요!</p>') +
    (more.length ? '<h2>연락하기를 주고받은 사람</h2>' + more.map(item).join('') : '');
}

function show(justJoined) {
  join.hidden = !!me; home.hidden = !me;
  if (!me) return;
  const saju = Saju.unpack(me.saju), rd = Saju.reading(saju), lis = a => '<ul class="plain">' + a.map(t => `<li>${esc(t)}</li>`).join('') + '</ul>';
  const mine = $('#mine'), per = Saju.periods();
  const fs = ['year', 'month', 'day'].map(k => Saju.fortune(saju, per[k], k));
  const star = n => '★'.repeat(n) + '☆'.repeat(5 - n);
  const nick = Saju.nickname(saju, fs[0].stars);
  mine.innerHTML = `<summary class="nickbox"><span class="emoji">${nick.emoji}</span><b class="nick">${esc(nick.text)}</b>
      <small class="muted">${esc(me.nickname)}님의 연애 사주 · 오늘 <span class="stars">${star(fs[2].stars)}</span> · 눌러서 보기</small></summary>
    ${fs.map(f => `<h3>${esc(f.title)} 연애운 <span class="stars">${star(f.stars)}</span></h3>${lis(f.lines)}`).join('')}
    <h3>타고난 성향: 당신은 어떤 사람 <small class="muted">${esc(rd.type)}</small></h3><p class="read">${esc(rd.me)}</p>
    <h3>연애 스타일</h3>${lis(rd.style)}
    <h3>이런 사람을 만나세요</h3>${lis(rd.meet)}
    <p class="hint">${esc(rd.avoid)}</p>
    <p class="hint">추천 목록의 사주 칸 색으로 상대의 기운을 볼 수 있어요: 초록 목 · 빨강 화 · 노랑 토 · 회색 금 · 파랑 수. 재미로 보는 풀이예요.</p>
    <h3>내 사주 8글자 <small class="muted">${esc(me.mbti || 'MBTI 모름')}</small></h3>${pillarsHtml(saju)}`;
  if (justJoined) mine.open = true;
  refresh();
}

const shareText = c => [
  `SaJuTeeing 궁합 ${c.m.total}점`,
  `${me.nickname} × ${c.nickname} (사주 ${c.m.saju.score}점${c.m.mbti ? ` · MBTI ${c.m.mbti.score}점` : ''})`,
  ...[...c.m.saju.reasons, ...(c.m.mbti ? c.m.mbti.reasons : [])].filter(r => r.pts > 0).slice(0, 3).map(r => '· ' + r.text),
  location.origin + location.pathname,
].join('\n');
async function copy(text, done) {
  try { await navigator.clipboard.writeText(text); msg(done); }       // 일부 앱 안 브라우저는 clipboard가 없음
  catch { msg('복사하지 못했어요. 길게 눌러 직접 복사해 주세요', true); }
}

list.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const c = cands[b.dataset.i];
  if (b.dataset.act === 'copy') return copy(c.kakao_id, '카카오톡 ID를 복사했어요');
  if (b.dataset.act === 'share') {
    const text = shareText(c);
    if (navigator.share) return navigator.share({ text }).catch(() => {});
    return copy(text, '궁합 결과를 복사했어요. 카카오톡 대화창에 붙여 넣으세요');
  }
  b.disabled = true;
  try {
    const matched = await rpc('like_profile', { my_id: me.id, my_token: me.token, target: c.id });
    msg(matched ? '매칭 성공! 카카오톡 ID가 열렸어요' : '연락하기를 보냈어요. 상대도 누르면 카카오톡 ID가 열려요');
    await refresh();
  } catch (err) {
    msg(err.message, true);
    if (me) await refresh();                                          // 상대가 탈퇴했으면 목록에서 빠진다
  }
});

for (const p of Object.keys(Saju.PLACES)) join.place.add(new Option(p, p));
join.place.add(new Option('해외·모름', '모름'));
for (const m of MBTI) join.mbti.add(new Option(m));
// 생년월일은 선택 상자로 받는다 (날짜 칸은 음력 2월 30일 같은 날짜를 막아서)
for (let y = new Date().getFullYear() - 19; y >= 1930; y--) join.year.add(new Option(`${y}년`, y));
for (let m = 1; m <= 12; m++) join.month.add(new Option(`${m}월`, m));
for (let d = 1; d <= 31; d++) join.day.add(new Option(`${d}일`, d));
for (let h = 0; h < 24; h++) join.hour.add(new Option(`${h < 12 ? '오전' : '오후'} ${h % 12 || 12}시${h === 0 ? ' (밤 12시)' : h === 12 ? ' (낮 12시)' : ''}`, h));
for (let m = 0; m < 60; m++) join.minute.add(new Option(`${m}분`, String(m).padStart(2, '0')));
const syncMinute = () => join.minute.disabled = !join.hour.value;
join.hour.addEventListener('change', syncMinute); syncMinute();
join.gender.addEventListener('change', () => join.want.value = join.gender.value === 'M' ? 'F' : 'M');

join.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = join.querySelector('button'), v = Object.fromEntries(new FormData(join));
  v.time = v.hour ? `${v.hour}:${v.minute}` : '';
  v.date = `${v.year}-${String(v.month).padStart(2, '0')}-${String(v.day).padStart(2, '0')}`;
  btn.disabled = true;
  try {
    const saju = Saju.calc(v), packed = Saju.pack(saju);
    const r = await rpc('register', { p: { nickname: v.nickname.trim(), gender: v.gender, want: v.want, birth: saju.solar, mbti: v.mbti, saju: packed, kakao_id: v.kakao_id.trim() } });
    me = { id: r.id, token: r.token, nickname: v.nickname.trim(), mbti: v.mbti, saju: packed };
    save(me); show(true); scrollTo(0, 0);
  } catch (err) { msg(err.message, true); }
  btn.disabled = false;
});

$('#del').addEventListener('click', async () => {
  if (!confirm('내 프로필과 연락하기 기록을 모두 삭제할까요? 되돌릴 수 없어요.')) return;
  try { await rpc('delete_me', { my_id: me.id, my_token: me.token }); } catch (e) { return msg(e.message, true); }
  me = null; save(null); show(); msg('삭제했어요');
});

show();
</script>
</body>
</html>
